[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hwpxpb"
version = "0.2.0"
description = "HWPX 양식 값 대입/추출, PDF 출력, 웹 에디터 제공 서버 (표준 라이브러리만 사용)"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
hwpxpb = "hwpxpb.cli:main"

[tool.setuptools]
packages = ["hwpxpb"]
