name: ocx
# PB 12.1 용 OCX 두 가지를 Windows 에서 빌드하고, 바로 쓸 수 있는 zip 을 만든다.
#   HwpxEditor-native.zip   C++ 판. .NET 불필요 (Windows 7 SP1 + .NET 4.0 PC 도 됨)
#   HwpxEditorOcx.zip       .NET Framework 4.8 판
# ocx-v* 태그를 올리거나, 수동 실행 때 release 에 태그 이름을 주면 두 zip 을 GitHub Release 에 첨부한다.
on:
  pull_request:
    paths: ["pb/**", ".github/workflows/ocx.yml"]
  push:
    branches: [main]
    tags: ["ocx-v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Release 태그 이름 (예: ocx-v0.1.0). 비우면 zip 만 만든다"
        required: false
permissions:
  contents: write
jobs:
  native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: ATL 설치 (러너의 Visual Studio 에 없으면)
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          if (Get-ChildItem "$vs\VC\Tools\MSVC\*\atlmfc\include\atlbase.h" -ErrorAction SilentlyContinue) { Write-Output "ATL 있음"; exit 0 }
          $p = Start-Process -Wait -PassThru -FilePath "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe" -ArgumentList @('modify', '--installPath', "`"$vs`"", '--add', 'Microsoft.VisualStudio.Component.VC.ATL', '--quiet', '--norestart', '--nocache')
          Write-Output "vs_installer exit $($p.ExitCode)"
          if (!(Get-ChildItem "$vs\VC\Tools\MSVC\*\atlmfc\include\atlbase.h" -ErrorAction SilentlyContinue)) { Write-Output "::error::ATL 설치 실패 ($($p.ExitCode))"; exit 1 }
      - name: WebView2 SDK 받기
        run: nuget install Microsoft.Web.WebView2 -Version 1.0.4078.44 -OutputDirectory pb/ocx-native/packages
      - name: OCX 빌드 (C++/ATL, Win32)
        shell: pwsh
        run: |
          msbuild pb/ocx-native/HwpxEditor.vcxproj /p:Configuration=Release /p:Platform=Win32 /m /nologo /v:minimal | Tee-Object build.log
          $code = $LASTEXITCODE
          # 오류 줄을 annotation 으로도 남긴다 (로그를 못 볼 때 원인 확인용)
          Select-String -Path build.log -Pattern ': (fatal )?error ' | Select-Object -First 30 | ForEach-Object { Write-Output "::error::$($_.Line.Trim())" }
          exit $code
      - name: zip 만들기
        shell: pwsh
        run: |
          $d = "out/HwpxEditor-native"
          New-Item -ItemType Directory $d | Out-Null
          Copy-Item pb/ocx-native/bin/HwpxEditor.ocx, pb/ocx-native/register.bat, pb/ocx-native/unregister.bat, LICENSE $d
          Copy-Item pb/ocx-native/README-설치.txt "$d/README.txt"
          Copy-Item pb/dist "$d/web" -Recurse
          if (!(Test-Path "$d/web/index.html")) { throw "web/index.html 없음" }
          Get-ChildItem $d | Format-Table Name, Length
          Compress-Archive -Path "$d/*" -DestinationPath out/HwpxEditor-native.zip
      - uses: actions/upload-artifact@v4
        with:
          name: HwpxEditor-native
          path: out/HwpxEditor-native.zip

  dotnet:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: OCX 빌드 (net48, x86)
        run: dotnet build pb/ocx/HwpxEditorOcx.csproj -c Release -o out/HwpxEditorOcx
      - name: zip 만들기
        shell: pwsh
        run: |
          $d = "out/HwpxEditorOcx"
          Copy-Item pb/ocx/register.bat, pb/ocx/unregister.bat, LICENSE $d
          Copy-Item pb/ocx/README-설치.txt "$d/README.txt"
          Remove-Item "$d/*.pdb" -ErrorAction SilentlyContinue
          if (!(Test-Path "$d/HwpxEditorOcx.dll")) { throw "HwpxEditorOcx.dll 없음" }
          if (!(Test-Path "$d/web/index.html")) { throw "web/index.html 없음" }
          Get-ChildItem $d | Format-Table Name, Length
          Compress-Archive -Path "$d/*" -DestinationPath out/HwpxEditorOcx.zip
      - uses: actions/upload-artifact@v4
        with:
          name: HwpxEditorOcx
          path: out/HwpxEditorOcx.zip

  release:
    needs: [native, dotnet]
    if: startsWith(github.ref, 'refs/tags/ocx-v') || inputs.release != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Release 에 첨부
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release || github.ref_name }}
        run: |
          cat > notes.md <<'NOTES'
          - **HwpxEditor-native.zip**: C++ 판. .NET 이 필요 없습니다 (Windows 7 SP1, .NET 4.0 PC 포함). 압축을 풀고 관리자 권한으로 register.bat.
          - **HwpxEditorOcx.zip**: .NET Framework 4.8 판.

          두 판은 ProgID(Hwpxpb.Editor)·메서드·이벤트가 같아 PB 코드는 그대로 씁니다. 한 PC 에는 하나만 등록하세요.
          설치 안내는 각 zip 의 README.txt 에 있습니다.
          NOTES
          gh release create "$TAG" out/HwpxEditor-native.zip out/HwpxEditorOcx.zip --repo "${{ github.repository }}" --target "${{ github.sha }}" --prerelease --title "OCX $TAG" --notes-file notes.md
