name: ocx
# PB 12.1 용 OCX 두 가지를 Windows 에서 빌드하고, 바로 쓸 수 있는 zip 을 만든다.
#   HwpxEditor-native.zip   C++ 판. .NET 불필요 (Windows 7 SP1 + .NET 4.0 PC 도 됨)
#   HwpxEditorOcx.zip       .NET Framework 4.8 판
# ocx-v* 태그를 올리거나, 수동 실행 때 release 에 태그 이름을 주면 두 zip 을 GitHub Release 에 첨부한다.
on:
  pull_request:
    paths: ["pb/**", ".github/workflows/ocx.yml"]
  push:
    branches: [main]
    tags: ["ocx-v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Release 태그 이름 (예: ocx-v0.1.0). 비우면 zip 만 만든다"
        required: false
permissions:
  contents: write
jobs:
  native:
    # v143(VS 2022) 도구로 빌드한다 (Windows 7 대상). windows-latest 는 VS 2026 이라 v143 용 ATL 이 없다
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: ATL 준비 (러너의 기본 MSVC 에 없으면 설치, 그래도 없으면 ATL 이 있는 MSVC 를 쓴다)
        id: atl
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $def = (Get-Content "$vs\VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt").Trim()
          $has = { param($v) Test-Path "$vs\VC\Tools\MSVC\$v\atlmfc\include\atlbase.h" }
          Get-ChildItem "$vs\VC\Tools\MSVC" | ForEach-Object { Write-Output "::notice::MSVC $($_.Name) ATL=$(& $has $_.Name)" }
          Write-Output "::notice::기본 MSVC $def"
          if (!(& $has $def)) {
            $p = Start-Process -Wait -PassThru -FilePath "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe" -ArgumentList @('modify', '--installPath', "`"$vs`"", '--add', 'Microsoft.VisualStudio.Component.VC.ATL', '--quiet', '--norestart', '--nocache')
            Write-Output "::notice::vs_installer exit $($p.ExitCode)"
          }
          $tools = ""
          if (!(& $has $def)) {
            $alt = Get-ChildItem "$vs\VC\Tools\MSVC" | Where-Object { & $has $_.Name } | Sort-Object Name -Descending | Select-Object -First 1
            if (!$alt) { Write-Output "::error::ATL 이 있는 MSVC 가 없습니다"; exit 1 }
            $tools = "/p:VCToolsVersion=$($alt.Name)"
            Write-Output "::notice::ATL 이 있는 MSVC $($alt.Name) 사용"
          }
          "tools=$tools" >> $env:GITHUB_OUTPUT
      - name: WebView2 SDK 받기
        run: nuget install Microsoft.Web.WebView2 -Version 1.0.4078.44 -OutputDirectory pb/ocx-native/packages
      - name: OCX 빌드 (C++/ATL, Win32)
        shell: pwsh
        run: |
          msbuild pb/ocx-native/HwpxEditor.vcxproj /p:Configuration=Release /p:Platform=Win32 ${{ steps.atl.outputs.tools }} /m /nologo /v:minimal | Tee-Object build.log
          $code = $LASTEXITCODE
          # 오류 줄을 annotation 으로도 남긴다 (로그를 못 볼 때 원인 확인용)
          Select-String -Path build.log -Pattern ': (fatal )?error ' | Select-Object -First 30 | ForEach-Object { Write-Output "::error::$($_.Line.Trim())" }
          exit $code
      - name: zip 만들기
        shell: pwsh
        run: |
          $d = "out/HwpxEditor-native"
          New-Item -ItemType Directory $d | Out-Null
          Copy-Item pb/ocx-native/bin/HwpxEditor.ocx, pb/ocx-native/register.bat, pb/ocx-native/unregister.bat, LICENSE $d
          Copy-Item pb/ocx-native/README-설치.txt "$d/README.txt"
          Copy-Item pb/dist "$d/web" -Recurse
          Copy-Item examples/pb "$d/pb-example" -Recurse
          if (!(Test-Path "$d/web/index.html")) { throw "web/index.html 없음" }
          Get-ChildItem $d | Format-Table Name, Length
          Compress-Archive -Path "$d/*" -DestinationPath out/HwpxEditor-native.zip
      - name: register.bat / unregister.bat 실행 확인
        # 러너는 관리자 권한이라 UAC 없이 돈다. pause 는 빈 입력으로 넘긴다
        timeout-minutes: 3
        shell: pwsh
        run: |
          $d = "out\HwpxEditor-native"
          $clsid = "Registry::HKEY_CLASSES_ROOT\WOW6432Node\CLSID\{6B2E7C1A-3F4D-4E8B-9A51-2C7D0E9F1A03}\InprocServer32"
          "" | cmd /c "$d\register.bat"
          if ($LASTEXITCODE -ne 0) { throw "register.bat exit $LASTEXITCODE" }
          if (!(Test-Path "Registry::HKEY_CLASSES_ROOT\Hwpxpb.Editor\CLSID")) { throw "ProgID Hwpxpb.Editor 가 등록되지 않음" }
          Write-Output "::notice::InprocServer32 = $((Get-ItemProperty $clsid).'(default)')"
          "" | cmd /c "$d\unregister.bat"
          if (Test-Path "Registry::HKEY_CLASSES_ROOT\Hwpxpb.Editor") { throw "unregister.bat 후에도 ProgID 가 남아 있음" }
      - name: Windows 7 용 zip (WebView2 109 고정 버전 x86 포함)
        shell: pwsh
        run: |
          # 최신 런타임 설치기는 Windows 7 에서 실행되지 않는다. 109 는 Windows 7 을 지원하는 마지막 버전.
          # 1) Microsoft CDN 의 109 고정 버전 cab, 2) 안 되면 NuGet 의 WebView2.Runtime.X86 109 패키지 (내용은 Microsoft 서명 파일)
          New-Item -ItemType Directory wv2 | Out-Null
          try {
            Invoke-WebRequest "https://msedge.sf.dl.delivery.mp.microsoft.com/filestreamingservice/files/671744ba-8b1f-42e2-878c-d7ae8ee081c4/Microsoft.WebView2.FixedVersionRuntime.109.0.1518.69.x86.cab" -OutFile wv2.cab
            expand.exe wv2.cab -F:* wv2 | Out-Null
            Write-Output "::notice::Microsoft CDN cab 사용"
          } catch {
            Write-Output "::notice::CDN 실패($($_.Exception.Message)), NuGet 사용"
            Invoke-WebRequest "https://api.nuget.org/v3-flatcontainer/webview2.runtime.x86/109.0.1518.78/webview2.runtime.x86.109.0.1518.78.nupkg" -OutFile wv2.zip
            Expand-Archive wv2.zip wv2
          }
          $exe = Get-ChildItem wv2 -Recurse -Filter msedgewebview2.exe | Select-Object -First 1
          if (!$exe) { Write-Output "::error::msedgewebview2.exe 없음"; exit 1 }
          $sig = Get-AuthenticodeSignature $exe.FullName
          Write-Output "::notice::서명 $($sig.Status) $($sig.SignerCertificate.Subject) / $($exe.VersionInfo.ProductVersion)"
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') { Write-Output "::error::서명 확인 실패"; exit 1 }
          $d = "out/HwpxEditor-native"
          Move-Item $exe.Directory.FullName "$d/webview2"
          Write-Output "::notice::webview2 $((Get-Item "$d/webview2/msedgewebview2.exe").VersionInfo.ProductVersion)"
          Compress-Archive -Path "$d/*" -DestinationPath out/HwpxEditor-native-win7.zip
          Get-ChildItem out/*.zip | ForEach-Object { Write-Output "::notice::$($_.Name) $([math]::Round($_.Length/1MB,1)) MB" }
      - uses: actions/upload-artifact@v4
        with:
          name: HwpxEditor-native
          path: |
            out/HwpxEditor-native.zip
            out/HwpxEditor-native-win7.zip

  dotnet:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: OCX 빌드 (net48, x86)
        run: dotnet build pb/ocx/HwpxEditorOcx.csproj -c Release -o out/HwpxEditorOcx
      - name: zip 만들기
        shell: pwsh
        run: |
          $d = "out/HwpxEditorOcx"
          Copy-Item pb/ocx/register.bat, pb/ocx/unregister.bat, LICENSE $d
          Copy-Item pb/ocx/README-설치.txt "$d/README.txt"
          Remove-Item "$d/*.pdb" -ErrorAction SilentlyContinue
          if (!(Test-Path "$d/HwpxEditorOcx.dll")) { throw "HwpxEditorOcx.dll 없음" }
          if (!(Test-Path "$d/web/index.html")) { throw "web/index.html 없음" }
          Get-ChildItem $d | Format-Table Name, Length
          Compress-Archive -Path "$d/*" -DestinationPath out/HwpxEditorOcx.zip
      - name: register.bat 실행 확인
        timeout-minutes: 3
        shell: pwsh
        run: |
          "" | cmd /c "out\HwpxEditorOcx\register.bat"
          if ($LASTEXITCODE -ne 0) { throw "register.bat exit $LASTEXITCODE" }
          if (!(Test-Path "Registry::HKEY_CLASSES_ROOT\Hwpxpb.Editor\CLSID")) { throw "ProgID Hwpxpb.Editor 가 등록되지 않음" }
          "" | cmd /c "out\HwpxEditorOcx\unregister.bat"
      - uses: actions/upload-artifact@v4
        with:
          name: HwpxEditorOcx
          path: out/HwpxEditorOcx.zip

  release:
    needs: [native, dotnet]
    if: startsWith(github.ref, 'refs/tags/ocx-v') || inputs.release != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Release 에 첨부
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release || github.ref_name }}
        run: |
          cat > notes.md <<'NOTES'
          - **HwpxEditor-native-win7.zip**: C++ 판 + WebView2 109 런타임(webview2 폴더) 포함. Windows 7 은 이것을 쓰세요. 런타임 설치가 필요 없습니다.
          - **HwpxEditor-native.zip**: C++ 판. .NET 이 필요 없습니다 (Windows 7 SP1, .NET 4.0 PC 포함). 압축을 풀고 관리자 권한으로 register.bat.
          - **HwpxEditorOcx.zip**: .NET Framework 4.8 판.

          두 판은 ProgID(Hwpxpb.Editor)·메서드·이벤트가 같아 PB 코드는 그대로 씁니다. 한 PC 에는 하나만 등록하세요.
          설치 안내는 각 zip 의 README.txt 에 있습니다.
          NOTES
          gh release create "$TAG" out/*.zip --repo "${{ github.repository }}" --target "${{ github.sha }}" --prerelease --title "OCX $TAG" --notes-file notes.md
